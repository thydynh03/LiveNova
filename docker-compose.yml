version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL — Primary Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tiktok_live_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiktok_user
      POSTGRES_PASSWORD: tiktok_secret
      POSTGRES_DB: tiktok_live_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiktok_user -d tiktok_live_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis — Audio Cache + Rate Limiting + Pub/Sub
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tiktok_live_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', 'redis_secret', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # NestJS Backend Server
  # ─────────────────────────────────────────
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: tiktok_live_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://tiktok_user:tiktok_secret@postgres:5432/tiktok_live_db
      REDIS_URL: redis://:redis_secret@redis:6379
      JWT_SECRET: change_me_in_production_32_chars_min
      JWT_REFRESH_SECRET: change_me_refresh_32_chars_min
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      GOOGLE_TTS_API_KEY: your_google_tts_key_here
      FACEBOOK_APP_ID: your_facebook_app_id
      FACEBOOK_APP_SECRET: your_facebook_app_secret
      GOOGLE_OAUTH_CLIENT_ID: your_google_oauth_client_id
      GOOGLE_OAUTH_CLIENT_SECRET: your_google_oauth_client_secret
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4001:4001'
    volumes:
      - ./apps/server:/app
      - /app/node_modules

  # ─────────────────────────────────────────
  # Next.js Web App
  # ─────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: tiktok_live_web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: development
      # Browser-facing: resolved on the host, so localhost is correct here.
      NEXT_PUBLIC_API_URL: http://localhost:4001
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
      # Server-facing: the BFF auth routes run *inside* this container, where
      # localhost is the web container itself, not the API. Must use the
      # compose service name.
      SERVER_API_URL: http://server:4001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: tiktok_live_network
