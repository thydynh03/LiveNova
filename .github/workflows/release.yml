name: Build & Release

# Build the full desktop installer only when a version tag is pushed (v*)
# NOT on every master push — Tauri build is slow.
# (Mirrors Agent Center release.yml approach exactly)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Fast validation gate before full build
  # ─────────────────────────────────────────
  test:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm --filter @tiktok-live/shared --filter @tiktok-live/server --filter @tiktok-live/web lint

      - name: Type-check server
        run: pnpm --filter @tiktok-live/server exec tsc --noEmit

      - name: Type-check web
        run: pnpm --filter @tiktok-live/web exec tsc --noEmit
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4001
          NEXT_PUBLIC_WS_URL: ws://localhost:4001

      - name: cargo check (Linux fast gate)
        working-directory: apps/desktop-app/src-tauri
        run: cargo check

  # ─────────────────────────────────────────
  # Build & Release Tauri Desktop Installer
  # Windows runner (shipping platform — mirrors Agent Center)
  # ─────────────────────────────────────────
  build-and-release:
    name: Build Windows Installer & Release
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (Swatinem — same as Agent Center)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-app/src-tauri

      # Install NSIS for Windows installer generation (same as Agent Center)
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Confirm makensis is on PATH
        shell: pwsh
        run: makensis /VERSION

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build Next.js web → used as Tauri webview assets
      - name: Build Next.js web
        run: pnpm --filter @tiktok-live/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: https://api.yourdomain.com
          NEXT_PUBLIC_WS_URL: wss://api.yourdomain.com

      # Resolve version from git tag (exact same pattern as Agent Center)
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            git describe --tags --abbrev=0 2>$null
            if (-not $?) { "v0.0.0-dev" }
          }
          $version = $tag -replace '^v', ''
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version (tag: $tag)"

      # Build Tauri desktop app with NSIS installer
      - name: Build Tauri Desktop App
        working-directory: apps/desktop-app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Create GitHub Release with installer
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TikTok LIVE Platform ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            apps/desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop-app/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
