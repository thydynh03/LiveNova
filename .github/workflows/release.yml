name: Build & Release

# Build the full desktop installer only when a version tag is pushed (v*)
# NOT on every master push — packaging the installer is slow.
# (Mirrors Agent Center release.yml approach exactly)
on:
  push:
    tags:
      - 'v*'
      # Ứng dụng máy tính có nhịp phát hành riêng với web và máy chủ, nên nó có
      # tiền tố tag riêng. Thiếu dòng này thì `desktop-v0.2.0` không khớp `v*`
      # và bản phát hành lặng lẽ chỉ còn mã nguồn — đúng chuyện đã xảy ra.
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Fast validation gate before full build
  # ─────────────────────────────────────────
  test:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/desktop-app/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm --filter @livenova/shared --filter @livenova/server --filter @livenova/web lint

      - name: Build shared package
        run: pnpm --filter @livenova/shared build

      - name: Generate Prisma client
        run: pnpm --filter @livenova/server prisma:generate

      - name: Type-check server
        run: pnpm --filter @livenova/server exec tsc --noEmit

      - name: Type-check web
        run: pnpm --filter @livenova/web exec tsc --noEmit
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4001
          NEXT_PUBLIC_WS_URL: ws://localhost:4001

      # Linux fast gate. The root package embeds assets and links the WebView,
      # so only internal/ is portable — which is also where the keystroke
      # limits, the Local Bridge handshake and the SSRF guard live.
      - name: Go desktop test (Linux fast gate)
        working-directory: apps/desktop-app
        run: go test ./internal/...

  # ─────────────────────────────────────────
  # Build & Release Wails Desktop Installer
  # Windows runner (shipping platform — mirrors Agent Center)
  # ─────────────────────────────────────────
  build-and-release:
    name: Build Windows Installer & Release
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/desktop-app/go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # Install NSIS for Windows installer generation (same as Agent Center)
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Confirm makensis is on PATH
        shell: pwsh
        run: makensis /VERSION

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bước dựng Next.js đã bị bỏ khỏi đây.
      #
      # Nó không đi vào bản cài: WebView lấy giao diện từ
      # apps/desktop-app/frontend/dist. Nó ở đây như một phép kiểm lúc phát
      # hành, nhưng nó chưa từng chạy được — thiếu bước dựng @livenova/shared
      # trước, nên webpack không phân giải nổi gói đó và cả bản phát hành dừng
      # lại. Không ai phát hiện ra vì bộ lọc tag khiến workflow này chưa bao giờ
      # chạy.
      #
      # Sửa cho nó chạy được cũng không đáng: job `test` phía trên đã kiểm kiểu
      # cho web, ci.yml đã dựng web ở mọi PR, và bước này dựng bằng địa chỉ giả
      # `api.yourdomain.com` nên kết quả không nói lên điều gì. Cái nó thực sự
      # làm là để một lỗi phía web chặn mất bản cài của ứng dụng máy tính.

      # Resolve version from git tag (exact same pattern as Agent Center)
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            git describe --tags --abbrev=0 2>$null
            if (-not $?) { "v0.0.0-dev" }
          }
          # Bỏ cả tiền tố `desktop-`, không chỉ chữ `v`. Nếu không, phiên bản
          # trở thành chuỗi "desktop-v0.2.0" và NSIS từ chối nó.
          $version = $tag -replace '^(desktop-)?v', ''
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version (tag: $tag)"

      # Phiên bản in trong installer lấy từ wails.json, còn tên bản phát hành
      # lấy từ tag. Hai nguồn khác nhau thì chúng sẽ lệch nhau, và người dùng
      # tải "0.2.0" về rồi thấy Programs and Features ghi 0.1.0.
      - name: Stamp version into wails.json
        working-directory: apps/desktop-app
        shell: pwsh
        run: |
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $cfg.info.productVersion = '${{ steps.ver.outputs.version }}'
          $cfg | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          Write-Host "productVersion = ${{ steps.ver.outputs.version }}"

      # Build Wails desktop app with NSIS installer
      - name: Build Wails Desktop App
        working-directory: apps/desktop-app
        run: wails build -nsis -skipbindings

      # Người dùng phải kiểm được thứ họ vừa tải là thứ CI vừa dựng.
      #
      # Không thay được cho chữ ký số — bất cứ ai sửa được tệp cũng sửa được
      # trang ghi mã băm. Nhưng nó chặn được trường hợp hay gặp hơn nhiều: tải
      # hỏng, hoặc một bản chép lại từ nhóm Facebook nào đó. Cho tới khi có
      # chứng thư ký số thì đây là thứ duy nhất ta đưa ra được.
      - name: Compute SHA-256 of every artifact
        id: sums
        working-directory: apps/desktop-app/build/bin
        shell: pwsh
        run: |
          # Không dùng here-string: dấu đóng `"@` của PowerShell bắt buộc nằm ở
          # cột 0, mà mọi dòng trong khối YAML này đều bị thụt lề.
          # [string] chứ không phải [char]: PowerShell không định nghĩa phép
          # nhân cho [char], nên `$tick * 3` ném lỗi ngay dòng thứ hai.
          $tick = [string][char]0x60
          $fence = $tick * 3
          $out = New-Object System.Collections.Generic.List[string]
          $out.Add('## Tải về')
          $out.Add('')
          $out.Add("- **$tick*-installer.exe$tick** — bản cài đặt. Chọn cái này nếu không chắc.")
          $out.Add("- **${tick}LiveNova Desktop.exe$tick** — bản chạy thẳng, không cài.")
          $out.Add('')
          $out.Add('## ⚠️ Bản này chưa được ký số')
          $out.Add('')
          $out.Add('Windows SmartScreen sẽ cảnh báo khi bạn mở. Đó là hành vi đúng của SmartScreen — chúng tôi chưa có chứng thư ký số, nên Windows không có cách nào xác minh tệp này đến từ ai.')
          $out.Add('')
          $out.Add('Trước khi mở, hãy đối chiếu mã băm bên dưới với tệp bạn vừa tải:')
          $out.Add('')
          $out.Add("${fence}powershell")
          $out.Add('Get-FileHash "đường\dẫn\tới\tệp.exe" -Algorithm SHA256')
          $out.Add($fence)
          $out.Add('')
          $out.Add('| Tệp | SHA-256 |')
          $out.Add('|---|---|')
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $out.Add("| $tick$($_.Name)$tick | $tick$h$tick |")
          }
          $out | Set-Content "$env:RUNNER_TEMP/notes.md" -Encoding utf8
          Get-Content "$env:RUNNER_TEMP/notes.md"

      # Create GitHub Release with installer
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LiveNova Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          body_path: ${{ runner.temp }}/notes.md
          # Cả bản cài lẫn bản chạy thẳng. Trước đây chỉ đính kèm installer,
          # nên ai muốn thử mà không cài vào máy thì không có đường nào.
          files: |
            apps/desktop-app/build/bin/*installer.exe
            apps/desktop-app/build/bin/LiveNova Desktop.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
