name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Shared Package — Build & Type Check
  # ─────────────────────────────────────────
  shared:
    name: Shared Package — Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @livenova/shared build

      - name: Lint shared package
        run: pnpm --filter @livenova/shared lint

      - name: Test shared package
        run: pnpm --filter @livenova/shared test

  # ─────────────────────────────────────────
  # NestJS Backend — Build, Lint, Type-check, Test
  # ─────────────────────────────────────────
  server:
    name: NestJS Server — Build, Lint & Test
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @livenova/shared build

      - name: Generate Prisma client
        run: pnpm --filter @livenova/server prisma:generate

      - name: Lint server
        run: pnpm --filter @livenova/server lint

      - name: Type-check server
        run: pnpm --filter @livenova/server exec tsc --noEmit

      - name: Build server
        run: pnpm --filter @livenova/server build

      - name: Test server
        run: pnpm --filter @livenova/server test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-value-that-is-long-enough-32
          JWT_REFRESH_SECRET: ci-refresh-secret-value-that-differs-32
          CORS_ORIGIN: http://localhost:3000

  # ─────────────────────────────────────────
  # Next.js Web — Build, Lint, Type-check
  # ─────────────────────────────────────────
  web:
    name: Next.js Web — Build & Lint
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @livenova/shared build

      - name: Lint web
        run: pnpm --filter @livenova/web lint

      - name: Type-check web
        run: pnpm --filter @livenova/web exec tsc --noEmit

      - name: Build web (SSG/SSR)
        run: pnpm --filter @livenova/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4001
          NEXT_PUBLIC_WS_URL: ws://localhost:4001
          # A production build refuses to start without this, so that a deploy
          # can never ship canonical tags pointing at localhost. CI supplies the
          # real origin; the hosting platform must set its own.
          NEXT_PUBLIC_SITE_URL: https://livenova.website

  # ─────────────────────────────────────────
  # Go Desktop App (Wails) — vet, test & build
  # ─────────────────────────────────────────
  desktop-windows:
    name: Go Desktop — vet, test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/desktop-app/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: gofmt check
        working-directory: apps/desktop-app
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build frontend
        run: pnpm --prefix apps/desktop-app/frontend build

      - name: go vet
        working-directory: apps/desktop-app
        run: go vet ./...

      - name: go test
        working-directory: apps/desktop-app
        run: go test ./...

      - name: Build desktop app
        working-directory: apps/desktop-app
        run: wails build

      - name: Check committed Wails bindings are up to date
        working-directory: apps/desktop-app
        shell: bash
        run: |
          if [ -n "$(git status --porcelain frontend/wailsjs)" ]; then
            echo "Wails JS bindings are out of date with Go structs/methods."
            echo "Run 'wails build' or 'wails generate module' locally and commit."
            git status --porcelain frontend/wailsjs
            exit 1
          fi
