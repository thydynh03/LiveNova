name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref to save CI minutes
# (borrowed from Agent Center ci.yml pattern)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Shared Package — Build & Type Check
  # ─────────────────────────────────────────
  shared:
    name: Shared Package — Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @tiktok-live/shared build

      - name: Lint shared package
        run: pnpm --filter @tiktok-live/shared lint

  # ─────────────────────────────────────────
  # NestJS Backend — Build, Lint, Type-check
  # ─────────────────────────────────────────
  server:
    name: NestJS Server — Build & Lint
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint server
        run: pnpm --filter @tiktok-live/server lint

      - name: Type-check server
        run: pnpm --filter @tiktok-live/server exec tsc --noEmit

      - name: Build server
        run: pnpm --filter @tiktok-live/server build

  # ─────────────────────────────────────────
  # Next.js Web — Build, Lint, Type-check
  # ─────────────────────────────────────────
  web:
    name: Next.js Web — Build & Lint
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @tiktok-live/web lint

      - name: Type-check web
        run: pnpm --filter @tiktok-live/web exec tsc --noEmit

      - name: Build web (SSG/SSR)
        run: pnpm --filter @tiktok-live/web build
        env:
          # Disable telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1
          # Dummy env vars for build validation
          NEXT_PUBLIC_API_URL: http://localhost:4001
          NEXT_PUBLIC_WS_URL: ws://localhost:4001

  # ─────────────────────────────────────────
  # Rust Desktop App — cargo check & clippy
  # Runs on Windows (shipping platform) — mirrors Agent Center pattern
  # of running native targets on the shipping OS
  # ─────────────────────────────────────────
  desktop-windows:
    name: Rust Desktop — cargo check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-app/src-tauri

      - name: cargo fmt check
        working-directory: apps/desktop-app/src-tauri
        run: cargo fmt -- --check

      - name: cargo check
        working-directory: apps/desktop-app/src-tauri
        run: cargo check

      - name: cargo clippy (deny warnings)
        working-directory: apps/desktop-app/src-tauri
        run: cargo clippy -- -D warnings

  # ─────────────────────────────────────────
  # Rust Desktop — cargo test (Linux, faster)
  # Same approach as Agent Center race detector job on Linux
  # ─────────────────────────────────────────
  desktop-linux:
    name: Rust Desktop — cargo test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-app/src-tauri

      - name: cargo test
        working-directory: apps/desktop-app/src-tauri
        run: cargo test
